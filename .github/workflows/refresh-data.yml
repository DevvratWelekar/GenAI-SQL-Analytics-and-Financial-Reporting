name: Refresh Synthetic Dataset

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  generate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install data dependencies
        run: python -m pip install --upgrade pip pandas numpy

      - name: Generate dataset
        run: python data/generate_data.py

      - name: Upload generated dataset
        uses: actions/upload-artifact@v4
        with:
          name: financial-sales-${{ github.run_number }}
          path: data/financial_sales.csv